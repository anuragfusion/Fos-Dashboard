/* ---------- helpers ---------- */

function dlong(s){ var dt=new Date(String(s).slice(0,10)+'T00:00:00'); return dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }

var gapDays = days.filter(function(d){ return !(d.claims>0) && String(d.day).slice(0,10) < today; }).map(function(d){return dd(d.day);});

/* ---------- derivation texts (every number has a path) ---------- */
var WHY = {
  risk: 'Counted: ERP clients whose latest status line in the last 30 days is at risk — client-health cancellation, cancellation risk, work moving in-house, POC leaving, or automation risk. Report names are matched to ERP companies; FTE comes from the ERP deal hierarchy. Money-signal cancellations are excluded: in insurance work they usually describe a policy, not the client.',

  if (t.reopened) return h('span',{cls:'tag red'},'Fix applied, did not work');

function closureSearch(t){

    h('h1',null, tiers.live+' of '+doms.length+' reporting functions '+(tiers.live===1?'is':'are')+' fully in the pipeline. That is why confidence reads '+conf+'.'),
    h('p',{cls:'lede'},'Pipeline figures are traceable to a named reporter. Gaps are listed as gaps rather than left as white space.'),
    h('div',{cls:'kpis',style:'grid-template-columns:repeat(3,1fr)'},
      h('div',null,h('div',{cls:'sub',style:'margin:0'},'In the pipeline'),h('div',{cls:'v grn'},String(tiers.live))),
      h('div',null,h('div',{cls:'sub',style:'margin:0'},'Partial'),h('div',{cls:'v amb'},String(tiers.partial))),
      h('div',null,h('div',{cls:'sub',style:'margin:0'},'Connected, silent this window'),h('div',{cls:'v'},String(tiers.silent)))),
    h('div',{cls:'note'},'This table lists every Teams channel marked as a reporting channel. A function with no channel at all does not appear here — tell the system which functions are expected so their absence becomes a visible gap.'),

    h('div',{cls:'sub'},'Split deliberately. The first column is what the reporting stream supports. The second is anything typed in by hand — labelled and never totalled with the first.'),

        h('div',{cls:'lbl'},'Revenue at risk, by named account'), h('b',null,'Cannot answer'), h('div',{cls:'sub'},'The EODR stream names accounts at risk but carries no contract value for any of them.'),
        h('div',{cls:'lbl'},'FTE by client state (ERP)'),
        h('div',{style:'font-size:13px;line-height:1.8'}, h('b',{style:'color:#d92d20'},(MONEY.fte_at_risk||0)+' FTE'),' at risk · ',h('b',null,(MONEY.fte_watch||0)+' FTE'),' on watch · ',h('b',{style:'color:#0e8f55'},(MONEY.fte_growing||0)+' FTE'),' growing · ',h('b',null,(MONEY.fte_no_reports||0)+' FTE'),' with no reports reaching FOS · of '+(MONEY.fte_total||0)+' FTE total.'),
        h('div',{cls:'lbl'},'Clients at risk, named'), clRisk.length ? h('ul',{style:'margin:0;padding-left:18px'}, clRisk.map(function(c){ return h('li',null,h('b',null,c.company_name),' — '+typeName(c.state_reason)+' · '+c.fte+' FTE · '+dd(c.state_date), c.state_line?h('div',{cls:'sub',style:'margin:2px 0 6px;font-style:italic'},'“'+c.state_line+'”'):null); })) : h('div',{cls:'sub'},'None in the last 30 days.'),
        h('div',{cls:'lbl'},'Money figures reported in EODRs (not reconciled)'),
        arr(MONEY.currency_lines).length ? h('ul',{style:'margin:0;padding-left:18px'}, arr(MONEY.currency_lines).map(function(m){ return h('li',null,'“'+m.line+'”', h('div',{cls:'sub',style:'margin:0 0 6px'}, (m.sender||'unknown')+' · '+(m.account||'no account')+' · '+dd(m.report_date))); }))
          : h('div',{cls:'sub'},'None in the last 30 days.'),
        h('div',{cls:'sub',style:'margin-top:6px'},'Shown as written. Currencies are never converted or added up.')),
      h('div',{cls:'card',style:'padding:16px'}, h('h3',null,'Manual entry ',h('span',{cls:'tag amb'},'manual · not pipeline-fed')),
        h('div',{cls:'sub'},'No manual figures are connected yet (revenue targets, FTE billing, errors per FTE). When they are, they appear here with their origin and are never summed with the pipeline column.'))),
    h('h2',null,'Functions and the honest status of their feed'),
    h('div',{cls:'card tw',style:'margin-top:10px'}, h('table',null, h('thead',null,h('tr',null,['Function','Teams','Tier','Messages in window','Last message'].map(function(x){return h('th',null,x);}))),
      h('tbody',null, doms.map(function(d){ var t=tier(d); return h('tr',null, h('td',null,h('b',null,domName(d.domain))), h('td',null,d.channels), h('td',null,h('span',{cls:'tag '+t[1]},t[0])), h('td',{cls:'n'},String(d.msgs_window)), h('td',null,dd(d.last_msg))); })))),
    h('h2',null,'What I am blind to'),
    h('div',{cls:'card tw',style:'margin-top:10px'}, h('table',null, h('thead',null,h('tr',null,['Day','TL reports received','Missing','Read'].map(function(x){return h('th',null,x);}))),
      h('tbody',null, days.map(function(d){ var day=String(d.day).slice(0,10), none=!(d.claims>0), isToday=day===today;
        return h('tr',null, h('td',null,dd(day)), h('td',{cls:'n'}, (none||isToday)?h('span',{cls:'nr'},isToday?'in progress':'n/r'):(d.tl_recv+' / '+exp.tl)), h('td',{cls:'n'}, (none||isToday)?h('span',{cls:'nr'},'—'):String(exp.tl-d.tl_recv)),
          h('td',null, isToday?'Day not complete':none?h('span',{cls:'tag red'},'no data — pipeline gap'):(d.tl_recv===exp.tl?'Complete':'Never complete'))); }))))];
}
function screenInbox(){
  return [ h('div',{cls:'eyebrow'},'Inbox · waiting for you'), h('h1',null, founder.length ? (founder.length+' ticket'+(founder.length===1?'':'s')+' flagged for your attention.') : 'Nothing is waiting for you.'),
    h('p',{cls:'lede'},'A ticket arrives here when it passes its SLA while still being reported, repeats on three or more days, or you press “Take this”. The attention agent attaches a case file with verified quotes.'),
    h('div',{cls:'card'}, founder.length ? founder.map(ticketRow) : h('div',{cls:'empty'},'Empty.')) ];
}

/* ---------- ask panel (deterministic answers; free text needs the Ask agent) ---------- */
var QS = [
  {q:'What did I ask for that never came back?', s:'Open tickets past deadline with no closure evidence', a:function(){ return pastDue.length ? ['n', pastDue.length+' ticket(s) are past deadline with no closure evidence.', pastDue.slice(0,8).map(function(t){return 'T-'+t.ticket_id+' · '+tTitle(t)+' · owner '+t.owner_name;})] : ['y','Nothing is past deadline.',[]]; }},
  {q:'Which Team Leads did not report on the last complete day?', s:'Coverage, not a guess', a:function(){ return latest ? ['n', tlMiss+' of '+exp.tl+' Team Leads did not report on '+dd(latest)+'.', missingTL] : ['c','There is no complete reporting day in the window.',[]]; }},
  {q:'Show me utilisation as a distribution, not an average', s:'Attested figures, one per person', a:function(){ var s=latestS; return s ? ['y','On '+dd(latest)+': '+s.util_people+' people reported a figure (average '+s.util_avg+'%).',['Exactly 100%: '+s.util_100,'Below 85%: '+s.util_below85,'Near zero: '+s.util_near0,'These are typed by the reporter — attested, not measured.']] : ['c','No complete day to answer from.',[]]; }},
  {q:'Which clients are at risk right now?', s:'Latest status line per ERP client, 30 days', a:function(){ return clRisk.length ? ['n', clRisk.length+' client(s) at risk ('+(MONEY.fte_at_risk||0)+' FTE); '+clWatch.length+' more on watch.', clRisk.map(function(c){return c.company_name+' — '+typeName(c.state_reason)+' · '+c.fte+' FTE · '+dd(c.state_date);})] : ['y','No client is at risk in the last 30 days.',[]]; }},
  {q:'What is my revenue at risk this quarter, by named account?', s:'The question the system should refuse', a:function(){ return ['c','Cannot answer. Contract value is not in the pipeline, so any number here would be invented.',[]]; }}
];
function showAnswer(box, item){
  var r=item.a(); box.textContent='';
  add(box, [ h('div',{cls:'verdict '+r[0]}, r[0]==='y'?'YES':r[0]==='n'?'NEEDS YOU':'CANNOT ANSWER'), h('div',null,h('b',null,item.q)), h('p',null,r[1]),
    r[2].length ? h('ul',{style:'padding-left:18px'}, r[2].map(function(x){return h('li',null,x);})) : null,
    h('button',{cls:'whyb',type:'button',on:{click:function(){ renderAsk(); }}},'← Other questions') ]);
}
var askBody;
function renderAsk(){
  askBody.textContent='';
  var inp=h('input',{cls:'askin',placeholder:'Type a question…',type:'text'}); var msg=h('div',{cls:'sub'});
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ msg.textContent='Free-text questions need the Ask agent, which is not connected yet. The questions below are answered from live data.'; }});
  add(askBody,[ inp, msg, h('p',{cls:'sub'},'Each answer below is computed from the same live data as the screens, so it cannot disagree with them. One of them is a refusal.'),
    QS.map(function(item){ return h('button',{cls:'qbtn',type:'button',on:{click:function(){ showAnswer(askBody,item); }}}, h('b',null,item.q), h('small',null,item.s)); }) ]);
}
function openAsk(){ ovl.classList.add('on'); panel.classList.add('on'); renderAsk(); }
function closeAsk(){ ovl.classList.remove('on'); panel.classList.remove('on'); }

/* ---------- frame ---------- */
var state={screen:'brief',tab:0}, sheet, ovl, panel;
function route(screen, tab){ state.screen=screen; state.tab=tab||0; draw(); window.scrollTo(0,0); }
function nav(key, label, sub, cnt, cls){
  return h('a',{href:'#'+key,cls:state.screen===key?'on':'',on:{click:function(e){ e.preventDefault(); route(key,0); }}},
    h('div',null, h('b',null,label), h('small',null,sub)), cnt?h('span',{cls:'cnt '+(cls||'')},String(cnt)):null);
}
function draw(){
  var root=document.getElementById('app'); root.textContent='';
  var coverageText = latestS
    ? ['Built from ', h('b',null,String(reportDays.reduce(function(a,d){return a+d.claims;},0))), ' claims across '+reportDays.length+' reporting day(s) ('+reportDays.map(function(d){return dd(d.day);}).join(', ')+'). ',
       h('b',null, tlMiss+' of '+exp.tl+' Team Leads'), ' did not report on '+dd(latest)+' — those pods read ', h('b',null,'unknown'), ', not ', h('i',null,'no issues'), '.',
       gapDays.length?(' No data at all on '+gapDays.join(', ')+'.'):'', stale?(' Pipeline last ran '+ago(hoursSince(lastRun))+'.'):'']
    : ['No complete reporting day in the window. Everything on this screen is unknown.'];
  var detail = h('div',{cls:'cdetail',hidden:'hidden'},
    h('table',{style:'max-width:760px'}, h('thead',null,h('tr',null,['Layer','Expected','Received on '+(latest?dd(latest):'—'),'Today so far'].map(function(x){return h('th',null,x);}))),
      h('tbody',null,
        h('tr',null,h('td',null,'Team Leads'),h('td',{cls:'n'},String(exp.tl)),h('td',{cls:'n'},latestS?String(latestS.tl_recv):'n/r'),h('td',{cls:'n'},D.today_in_progress?String(D.today_in_progress.tl):'—')),
        h('tr',null,h('td',null,'Umbrella Managers'),h('td',{cls:'n'},String(exp.um)),h('td',{cls:'n'},latestS?String(latestS.um_recv):'n/r'),h('td',{cls:'n'},D.today_in_progress?String(D.today_in_progress.um):'—')),
        h('tr',null,h('td',null,'Associates (VA)'),h('td',{cls:'n nr'},'roster-free'),h('td',{cls:'n'},latestS?String(latestS.va_recv):'n/r'),h('td',{cls:'n'},D.today_in_progress?String(D.today_in_progress.va):'—')))),
    h('div',{cls:'sub',style:'margin-top:8px'},'Last Teams ingest '+ago(hoursSince(D.freshness&&D.freshness.teams_ingest))+' · last RNN ingest '+ago(hoursSince(D.freshness&&D.freshness.rnn_ingest))+' · newest claim '+dd(D.freshness&&D.freshness.latest_claim)+'.'));
  var dbtn = h('button',{cls:'dt',type:'button',on:{click:function(){ if(detail.hasAttribute('hidden')) detail.removeAttribute('hidden'); else detail.setAttribute('hidden','hidden'); }}},'Coverage detail ↓');
  var screen = state.screen==='clients'?screenClients(state.tab): state.screen==='ledger'?screenLedger(): state.screen==='sources'?screenSources(): state.screen==='inbox'?screenInbox(): screenBrief(state.tab);
  sheet = h('div',{cls:'sheet'}, screen);
  ovl = h('div',{cls:'ovl',on:{click:closeAsk}});
  askBody = h('div',{cls:'pb'});
  panel = h('div',{cls:'panel',role:'dialog'}, h('div',{cls:'ph'}, h('div',null,h('div',{cls:'eyebrow'},'Ask'),h('h3',{style:'font-size:20px;margin:4px 0 0'},'Ask the corpus')), h('button',{type:'button',on:{click:closeAsk}},'×')), askBody);
  add(root, h('div',{cls:'app'},
    h('aside',{cls:'rail'}, h('div',{cls:'brand'},h('b',null,'FBSPL'),h('small',null,'FOUNDER’S OPERATING SYSTEM')),
      h('div',{cls:'navh'},'WHERE TO LOOK'),
      h('nav',{cls:'nav'}, nav('brief','Brief','What needs me today',Math.min(7,open.length)), nav('clients','Clients','Who might leave, who is quiet',clRisk.length), nav('ledger','Ledger','What the agents are tracking',pastDue.length), nav('sources','Sources','How much can I believe'), nav('inbox','Inbox','Waiting for me',founder.length,'b')),
      h('div',{cls:'foot'}, h('b',null,'Live · '+dd(today)), h('div',null,'Built from Teams + RNN EODRs through the FOS pipeline. Tickets from '+dd(D.start_date)+'. Generated '+new Date(D.generated_at).toLocaleString('en-GB',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' IST.'))),
    h('main',{cls:'main'},
      h('div',{cls:'top'}, h('div',{cls:'ask',on:{click:openAsk}}, '⌕ ', h('span',null,'Ask the corpus — what did I ask for that never came back?'), h('span',{cls:'kbd'},'Ask')),
        h('span',{cls:'pill conf'},'CONFIDENTIAL'), h('span',{cls:'pill live'},'LIVE'),
        h('div',{cls:'who'},h('b',null,'MSD'),'Founder view')),
      h('div',{cls:'cstrip '+conf.toLowerCase()}, h('span',{cls:'lvl'},'CONFIDENCE',h('b',null,conf)), h('span',null,coverageText), dbtn),
      detail, sheet,
      h('div',{cls:'pagefoot'}, h('span',null,h('b',null,'Live'),' — reads the FOS database on every load.'), h('span',null,'Agents create and close tickets; nothing on this screen is edited by hand.'), h('span',null,'Every figure is traceable to a line a named person wrote, or says n/r.'))),
    ovl, panel));
}
document.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openAsk(); } if(e.key==='Escape') closeAsk(); });
draw();
})();
